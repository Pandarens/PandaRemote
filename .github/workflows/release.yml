# Builds, signs and publishes a release when a version tag (v1.2.3) is pushed.
# Panda installs only releases whose signature matches the key built into it (src/update.rs);
# the private half lives in the PANDA_SIGNING_KEY repository secret.
name: release

on:
  push:
    tags: ["v*"]
  # Manual run: builds and signs everything, publishes nothing (to check the pipeline).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $crate"; exit 1; }

      - run: cargo test --release
      - run: cargo build --release

      - name: Sign
        env:
          PANDA_SIGNING_KEY: ${{ secrets.PANDA_SIGNING_KEY }}
        run: target/release/panda-rc.exe release-sign target/release/panda-rc.exe

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/panda-rc.exe
            target/release/panda-rc.exe.sig

  # The Android app, attached to the same release. It is signed with the key in PANDA_APK_KEYSTORE_B64,
  # so each new APK installs over the previous one; the app finds it through the GitHub API.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android

      - name: Tag must match both versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          for f in Cargo.toml android/Cargo.toml; do
            v=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $f $v"; exit 1; }
          done

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - run: cargo install cargo-apk --locked

      - name: Build and sign the APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          KEYSTORE_B64: ${{ secrets.PANDA_APK_KEYSTORE_B64 }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PANDA_APK_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          cd android && cargo apk build --release

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/target/release/apk/panda-remote.apk

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: panda-remote-apk
          path: android/target/release/apk/panda-remote.apk
