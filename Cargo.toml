[package]
name = "panda-rc"
version = "0.4.4"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
anyhow = "1.0.104"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18"
data-encoding = "2.11.1"
directories = "6.0.0"
humantime = "2.4.0"
iroh = "1.4"
openh264 = "0.9"
opus-rs = "0.1.39"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
reed-solomon-simd = "3"
resvg = { version = "0.47", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
mp4 = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
iroh-mainline-address-lookup = "0.6.1"

# Desktop only: the host, the desktop window and self-update are not part of the Android viewer.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37"
arboard = { version = "3", default-features = false }
gilrs = "0.11"
raw-window-handle = "0.6"
rfd = "0.16"
xcap = "0.9"

# The Android app brings its own activity glue; accesskit does not work with NativeActivity.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
log = "0.4"
ndk = { version = "0.9", features = ["media", "api-level-26"] }

[target."cfg(windows)".dependencies]
tiny-skia = "0.12"
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_Security", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }
windows-service = "0.8"
tray-icon = "0.21"
